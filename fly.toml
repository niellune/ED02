# Deploy: fly launch --no-deploy && fly volumes create keepqr_data --size 1 && fly secrets set SESSION_SECRET=... && fly deploy
app = "keepqr"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/keepqr.db"
  TRUST_PROXY = "1"

[mounts]
  source = "keepqr_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # redirects must always answer instantly
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
